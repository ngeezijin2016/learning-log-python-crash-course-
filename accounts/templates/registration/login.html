{% extends 'learning_logs/base.html' %}

{% block content %}
<!-- Fluent UI Changing Gradient & Acrylic Background Container -->
<div class="fluent-bg-wrapper">
  
  <div class="fluent-card-3d-wrapper">
    <div id="login-card" class="fluent-card">
      
      <!-- Django Error Notification -->
      {% if form.errors %}
        <div style="background-color: #fde7e9; border-left: 4px solid #d13438; padding: 10px; margin-bottom: 15px; border-radius: 2px;">
          <p style="color: #a80000; font-size: 13px; margin: 0; font-weight: 600;">
            Wrong password or username. Try again.
          </p>
        </div>
      {% endif %}

      <!-- Fluent Loading Bar (Progress Dots) -->
      <div id="fluent-loader" class="fluent-progress-bar" style="display: none;">
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
      </div>

      <form method="post" action="{% url 'accounts:login' %}" id="fluent-login-form">
        {% csrf_token %}

        <!-- STEP 1: USERNAME -->
        <div id="step-username" class="step-content">
          <h2 style="font-size: 24px; font-weight: 600; margin: 0 0 4px 0; color: #111827;">Sign in</h2>
          <p style="color: #616161; font-size: 14px; margin: 0 0 20px 0;">with your account</p>

          <div style="margin-bottom: 20px;">
            <input type="text" name="username" id="id_username" placeholder="Username" required autofocus class="fluent-input">
          </div>

          <button type="button" class="btn-fluent" onclick="transitionToPassword()" style="width: 100%; cursor: pointer;">
            Next
          </button>
        </div>

        <!-- STEP 2: PASSWORD -->
        <div id="step-password" class="step-content" style="display: none;">
          <h2 style="font-size: 20px; font-weight: 600; margin: 0 0 4px 0; color: #111827;" id="user-greeting">Hello</h2>
          <p style="color: #616161; font-size: 13px; margin: 0 0 20px 0;">Verify it's you</p>

          <div style="margin-bottom: 20px;">
            <input type="password" name="password" id="id_password" placeholder="Password" class="fluent-input">
          </div>

          <div style="display: flex; align-items: center; justify-content: space-between;">
            <button type="button" onclick="transitionToUsername()" class="btn-back">
              Back
            </button>
            <button type="submit" onclick="showLoading()" class="btn-fluent" style="min-width: 100px; cursor: pointer;">
              Sign in
            </button>
          </div>
        </div>

        <input type="hidden" name="next" value="{% url 'learning_logs:topics' %}" />
      </form>

    </div>
  </div>
</div>

<style>
  /* 1. Dynamic Fluent Background Gradient */
  .fluent-bg-wrapper {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(-45deg, #0078d4, #002050, #00b7c3, #2b88d8);
    background-size: 400% 400%;
    animation: fluentGradient 15s ease infinite;
    padding: 20px;
    border-radius: 8px;
  }

  @keyframes fluentGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* 2. Card Perspective & Acrylic Blur Effect */
  .fluent-card-3d-wrapper {
    perspective: 1000px;
  }

  .fluent-card {
    width: 340px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 8px;
    padding: 32px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
    transform-style: preserve-3d;
  }

  /* Flip Down / Out Animations */
  .flip-down {
    transform: rotateX(-90deg);
    opacity: 0;
  }

  /* Custom Input Styling */
  .fluent-input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #8a8886;
    border-bottom: 2px solid #0078d4;
    border-radius: 2px;
    box-sizing: border-box;
    font-size: 14px;
    outline: none;
    background: rgba(255,255,255,0.9);
    transition: all 0.2s ease;
  }

  .fluent-input:focus {
    border-color: #0078d4;
    box-shadow: 0 0 4px rgba(0, 120, 212, 0.4);
  }

  .btn-back {
    background: transparent;
    border: none;
    color: #0078d4;
    cursor: pointer;
    font-size: 13px;
    padding: 0;
    text-decoration: underline;
  }

  /* 3. Fluent Progress Dots Loading Animation */
  .fluent-progress-bar {
    position: relative;
    width: 100%;
    height: 4px;
    margin-bottom: 15px;
    overflow: hidden;
  }

  .progress-dot {
    position: absolute;
    width: 4px;
    height: 4px;
    background-color: #0078d4;
    border-radius: 50%;
    animation: fluentDots 2s infinite ease-in-out;
    opacity: 0;
  }

  .progress-dot:nth-child(1) { animation-delay: 0.0s; }
  .progress-dot:nth-child(2) { animation-delay: 0.15s; }
  .progress-dot:nth-child(3) { animation-delay: 0.30s; }
  .progress-dot:nth-child(4) { animation-delay: 0.45s; }
  .progress-dot:nth-child(5) { animation-delay: 0.60s; }

  @keyframes fluentDots {
    0% { left: 0%; opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { left: 100%; opacity: 0; }
  }
</style>

<script>
  const hasErrors = {% if form.errors %} true {% else %} false {% endif %};
  const card = document.getElementById('login-card');

  // Smooth Flip Down Transition from Username to Password
  function transitionToPassword() {
    const usernameInput = document.getElementById('id_username');
    if (!usernameInput.value.trim()) {
      usernameInput.reportValidity();
      return;
    }

    // Trigger flip down animation
    card.classList.add('flip-down');

    setTimeout(() => {
      document.getElementById('user-greeting').innerText = "Hello " + usernameInput.value;
      document.getElementById('step-username').style.display = 'none';
      document.getElementById('step-password').style.display = 'block';

      // Flip back up
      card.classList.remove('flip-down');
      
      setTimeout(() => {
        document.getElementById('id_password').focus();
      }, 100);
    }, 300);
  }

  // Smooth Flip Down Transition back to Username
  function transitionToUsername() {
    card.classList.add('flip-down');

    setTimeout(() => {
      document.getElementById('step-password').style.display = 'none';
      document.getElementById('step-username').style.display = 'block';

      card.classList.remove('flip-down');
      document.getElementById('id_username').focus();
    }, 300);
  }

  // Display Fluent Loading dots during form submission
  function showLoading() {
    document.getElementById('fluent-loader').style.display = 'block';
  }

  document.addEventListener('DOMContentLoaded', () => {
    const usernameEl = document.getElementById('id_username');
    if (usernameEl) {
      usernameEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          transitionToPassword();
        }
      });
    }

    if (hasErrors) {
      document.getElementById('step-username').style.display = 'none';
      document.getElementById('step-password').style.display = 'block';
    }
  });
</script>
{% endblock content %}
